name: CI

on:
  pull_request:
  push:
    branches: [develop, main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geochat_ci
          POSTGRES_USER: geochat_ci
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U geochat_ci -d geochat_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      GEOCHAT_VALIDATE_POSTGRES: 'true'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: geochat_ci
      DB_USERNAME: geochat_ci
      DB_PASSWORD: isolated-ci-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw
      - run: psql -h localhost -U geochat_ci -d geochat_ci -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
        env:
          PGPASSWORD: isolated-ci-only
      - run: ./mvnw -B test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --file backend/Dockerfile --tag geochat-backend:ci backend
      - run: docker build --file apps/web/Dockerfile --tag geochat-web:ci apps/web
