spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: geochat
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geochat}
    username: ${DB_USERNAME:geochat}
    password: ${DB_PASSWORD:geochat}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:vK7!qP2#xR9$mN4@tY8%wL3&cF6*zH1!}
  expiration-ms: 3600000

app:
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}

push-notifications:
  enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
  expo:
    url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    access-token: ${EXPO_ACCESS_TOKEN:}

server:
  port: ${SERVER_PORT:8080}

geochat:
  upload:
    storage-path: ${GEOCHAT_IMAGE_STORAGE:./var/chat-images}
    max-image-size: ${GEOCHAT_MAX_IMAGE_SIZE:5242880}
    allowed-types: ${GEOCHAT_IMAGE_TYPES:image/jpeg,image/png,image/webp}
