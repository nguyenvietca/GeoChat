facebook:
  enabled: ${FACEBOOK_LOGIN_ENABLED:false}
  app-id: ${FACEBOOK_APP_ID:}
  app-secret: ${FACEBOOK_APP_SECRET:}
  redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:8081/api/login/oauth2/code/facebook}
  graph-version: ${FACEBOOK_GRAPH_VERSION:v25.0}

# OAuth requests carry secrets; keep framework HTTP payload logging disabled
# even when a local developer enables general Spring Web DEBUG logging.
logging:
  level:
    org.springframework.web.client: WARN
    org.springframework.web.HttpLogging: WARN
    org.springframework.security.oauth2: WARN
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: WARN

google:
  enabled: ${GOOGLE_ENABLED:false}
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/login/oauth2/code/google}
  web-origin: ${GOOGLE_WEB_ORIGIN:http://localhost:8081}

spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:nguyenvietca199x@gmail.com}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  config:
    import: optional:file:./config/google-local.properties,optional:file:./backend/config/google-local.properties
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: geochat
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geochat}
    username: ${DB_USERNAME:geochat}
    password: ${DB_PASSWORD:geochat}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:vK7!qP2#xR9$mN4@tY8%wL3&cF6*zH1!}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  admin-operator:
    enabled: ${ADMIN_OPERATOR_ENABLED:false}
    user-id: ${ADMIN_OPERATOR_USER_ID:0}
    action: ${ADMIN_OPERATOR_ACTION:}
    confirmation: ${ADMIN_OPERATOR_CONFIRMATION:}
    reason: ${ADMIN_OPERATOR_REASON:}
  chat:
    max-group-members: ${MAX_GROUP_MEMBERS:100}
  super-admin:
    enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
    username: ${SUPER_ADMIN_USERNAME:super_admin}
    email: ${SUPER_ADMIN_EMAIL:geochat_super_admin@gmail.com}
    password: ${SUPER_ADMIN_PASSWORD:super_adminx@X}
  password-reset:
    enabled: ${PASSWORD_RESET_ENABLED:true}
    web-origin: ${PASSWORD_RESET_WEB_ORIGIN:http://localhost:5173}
    from: ${SMTP_FROM:nguyenvietca199x@gmail.com}
  security:
    trusted-proxy-hosts: ${TRUSTED_PROXY_HOSTS:}
    registration-bot-check:
      enabled: ${REGISTRATION_BOT_CHECK_ENABLED:false}
      site-key: ${TURNSTILE_SITE_KEY:}
      secret: ${TURNSTILE_SECRET:}
      hostnames: ${TURNSTILE_HOSTNAMES:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173}

push-notifications:
  enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
  expo:
    url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    access-token: ${EXPO_ACCESS_TOKEN:}

server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}

geochat:
  upload:
    storage-path: ${GEOCHAT_IMAGE_STORAGE:./var/chat-images}
    max-image-size: ${GEOCHAT_MAX_IMAGE_SIZE:5242880}
    allowed-types: ${GEOCHAT_IMAGE_TYPES:image/jpeg,image/png,image/webp}
