google:
  enabled: false
  client-id: ""
  client-secret: ""
  redirect-uri: http://localhost:8081/api/login/oauth2/code/google
  web-origin: http://localhost:8081

spring:
  datasource:
    url: jdbc:h2:mem:geochat_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
jwt:
  secret: test-only-key-not-a-real-secret-32-bytes-min
  expiration-ms: 3600000
app:
  security:
    rate-limit:
      enabled: false

geochat:
  upload:
    storage-path: ./target/test-images-shared
