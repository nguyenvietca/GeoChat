services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Host users with Docker access can inspect environment variables. Use a
      # dedicated secret manager when deploying beyond a single Compose host.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [data]
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: ./backend
    image: geochat-backend:${APP_VERSION:-local}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/api/login/oauth2/code/google}
      GOOGLE_WEB_ORIGIN: ${GOOGLE_WEB_ORIGIN:-http://localhost:8081}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      TRUSTED_PROXY_HOSTS: web
      REGISTRATION_BOT_CHECK_ENABLED: ${REGISTRATION_BOT_CHECK_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      GEOCHAT_IMAGE_STORAGE: /app/var/chat-images
      GEOCHAT_MAX_IMAGE_SIZE: ${GEOCHAT_MAX_IMAGE_SIZE:-5242880}
      GEOCHAT_IMAGE_TYPES: ${GEOCHAT_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    volumes:
      - chat_images:/app/var/chat-images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [app, data]
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ""
    image: geochat-web:${APP_VERSION:-local}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [app]
    logging:
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  chat_images:

networks:
  app:
  data:
